name: Supabase keepalive

on:
  schedule:
    # UTC: 00:17, 06:17, 12:17, 18:17. WIB: 07:17, 13:17, 19:17, 01:17.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.repository == 'kuchikamizake05/porto'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/supabase-keepalive/package-lock.json
      - name: Install keepalive dependencies
        run: npm ci --ignore-scripts --prefix scripts/supabase-keepalive
      - name: Test keepalive behavior
        run: npm test --prefix scripts/supabase-keepalive
      - name: Query Supabase
        env:
          SUPABASE_KEEPALIVE_DATABASE_URL: ${{ secrets.SUPABASE_KEEPALIVE_DATABASE_URL }}
        run: npm start --prefix scripts/supabase-keepalive
